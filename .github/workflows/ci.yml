name: CI

# Cloudflare owns validation and deployment for changes isolated to apps/site.
on:
  pull_request:
    paths-ignore:
      - "apps/site/**"
  push:
    branches:
      - main
    paths-ignore:
      - "apps/site/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter '!@offerkit/site' -r typecheck

      - name: Lint
        run: pnpm --filter '!@offerkit/site' -r lint

      - name: Test
        env:
          OFFERKIT_TEST_PGLITE: "1"
          BETTER_AUTH_SECRET: "test-secret-1234567890123456789012"
          WEBHOOK_SECRET_ENCRYPTION_KEY: "test-webhook-encryption-key-with-at-least-32-characters"
        run: pnpm --filter '!@offerkit/site' -r test

      - name: Build
        run: pnpm turbo run build --filter='!@offerkit/site'
